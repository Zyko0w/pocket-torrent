# Tests automatiques à chaque envoi et à chaque demande de fusion.
# À utiliser dans un dépôt PRIVÉ (le code source n'est pas publié ; pocket-torrent-releases
# ne contient que les installateurs). Aucun secret n'est nécessaire : rien n'est signé ni publié ici.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# lecture seule : la CI ne peut rien modifier dans le dépôt. Actions externes figées sur un
# commit précis (un tag peut être déplacé vers du code malveillant) ; les mettre à jour à la main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml pointe vers le CMake des Build Tools installés sur le PC de développement :
  # sur la machine de GitHub, celui du PATH (une variable déjà définie l'emporte sur [env])
  CMAKE: cmake

jobs:
  test:
    name: Tests et vérifications (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances de l'interface
        run: npm ci

      - name: Interface — types
        run: npx tsc -b --noEmit

      - name: Interface — tests (vitest)
        run: npm test

      - name: Interface — compilation (dist, requis par Tauri)
        run: npx vite build

      - name: Dépendances de l'interface — failles connues
        run: npm audit --omit=dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Tauri exige ce fichier (ressource de l'installateur) avant de compiler l'application
      - name: Programme du tunnel (release)
        working-directory: src-tauri
        run: cargo build --release -p pocket-torrent-tunnel

      - name: Rust — clippy (avertissements = erreurs)
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      - name: Rust — tests de l'application (dont tests d'intrusion en bac à sable)
        working-directory: src-tauri
        run: cargo test --lib

      - name: Rust — tests du tunnel (faux service sur un canal nommé de test)
        working-directory: src-tauri/tunnel
        run: cargo test --lib

      - name: Rust — tests des trackers
        working-directory: src-tauri
        run: cargo test -p librqbit-tracker-comms --lib

      - name: Rust — tests du moteur (librqbit vendorisé : essaims locaux, tests d'intrusion)
        working-directory: src-tauri/vendor/librqbit
        run: >-
          cargo test --lib --target-dir ../../target/librqbit-tests --no-default-features --features rust-tls
          --config 'patch.crates-io.librqbit-dualstack-sockets.path="../librqbit-dualstack-sockets"'
          --config 'patch.crates-io.librqbit-tracker-comms.path="../librqbit-tracker-comms"'
          --config 'patch.crates-io.librqbit-dht.path="../librqbit-dht"'
          --config 'patch.crates-io.librqbit-core.path="../librqbit-core"'
          --config 'patch.crates-io.librqbit-bencode.path="../librqbit-bencode"'
          --config 'patch.crates-io.librqbit-peer-protocol.path="../librqbit-peer-protocol"'
          --config 'patch.crates-io.librqbit-upnp.path="../librqbit-upnp"'
          --config 'patch.crates-io.librqbit-utp.path="../librqbit-utp"'

      - name: Rust — tests DHT (BEP 42, fuzzing des messages)
        working-directory: src-tauri/vendor/librqbit-dht
        run: >-
          cargo test --lib --target-dir ../../target/dht-tests
          --config 'patch.crates-io.librqbit-dualstack-sockets.path="../librqbit-dualstack-sockets"'
          --config 'patch.crates-io.librqbit-core.path="../librqbit-core"'
          --config 'patch.crates-io.librqbit-bencode.path="../librqbit-bencode"'

      - name: Rust — tests UPnP (faux appareil du réseau local)
        working-directory: src-tauri/vendor/librqbit-upnp
        run: cargo test --lib --target-dir ../../target/upnp-tests

      - name: Rust — tests µTP (librqbit-utp vendorisé)
        working-directory: src-tauri/vendor/librqbit-utp
        run: cargo test --lib --target-dir ../../target/utp-tests

      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-audit

      - name: Rust — failles connues (RustSec)
        working-directory: src-tauri
        run: cargo audit
